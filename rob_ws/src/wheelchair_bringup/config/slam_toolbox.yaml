slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping

    # IMPORTANT: match your frames
    map_frame: map
    odom_frame: odom
    base_frame: base_link

    scan_topic: /scan
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 1.0
    resolution: 0.05
